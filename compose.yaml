# Local development database. Production compose file comes with the first release.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tasklane
      POSTGRES_PASSWORD: tasklane
      POSTGRES_DB: tasklane
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
volumes:
  dbdata:
