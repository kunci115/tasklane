# Start tasklane with a database. Everything else (GitHub, the agent's key, isolation) is set up in the
# console after it starts:
#   POSTGRES_PASSWORD=$(openssl rand -hex 16) docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs tasklane      # shows the admin token once
#   then open http://localhost:8080
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasklane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD first (see the comment at the top of this file)}
      POSTGRES_DB: tasklane
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklane"]
      interval: 5s
      retries: 10
  tasklane:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TASKLANE_DATABASE_URL: postgres://tasklane:${POSTGRES_PASSWORD}@db:5432/tasklane
      # Optional: the address people use to reach the console (needed for webhooks and behind a proxy)
      TASKLANE_PUBLIC_URL: ${TASKLANE_PUBLIC_URL:-}
    env_file:
      - path: .env
        required: false     # advanced settings can go in .env; see docs/operations.md
    ports:
      - "127.0.0.1:8080:8080"   # put a TLS reverse proxy in front of this for anything but a local try
    volumes:
      - workdata:/data         # git checkouts and the secrets saved from the console
volumes:
  dbdata:
  workdata:
