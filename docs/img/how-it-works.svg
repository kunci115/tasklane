<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">
<title>How tasklane handles an issue: triage, risk level, approval if needed, development, re-check, pull request, CI, review, merge</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
