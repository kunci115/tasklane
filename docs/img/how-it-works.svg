<rect x="590" y="40" width="160" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="670.0" y="68" text-anchor="middle" font-weight="600">Developer agent</text><text x="670.0" y="87" text-anchor="middle" font-size="12" fill="#475569">isolated git worktree</text>
<rect x="780" y="40" width="160" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="860.0" y="68" text-anchor="middle" font-weight="600">Re-check</text><text x="860.0" y="87" text-anchor="middle" font-size="12" fill="#475569">the real diff</text>
<rect x="400" y="170" width="160" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="480.0" y="198" text-anchor="middle" font-weight="600">Approval</text><text x="480.0" y="217" text-anchor="middle" font-size="12" fill="#475569">of the exact plan or diff</text>
<rect x="780" y="300" width="160" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="860.0" y="338" text-anchor="middle" font-weight="600">Pull request</text>
<rect x="590" y="300" width="160" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="670.0" y="338" text-anchor="middle" font-weight="600">Your CI</text>
<rect x="400" y="300" width="160" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="480.0" y="338" text-anchor="middle" font-weight="600">Reviewer agent</text>
<rect x="210" y="300" width="160" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="290.0" y="328" text-anchor="middle" font-weight="600">Merge</text><text x="290.0" y="347" text-anchor="middle" font-size="12" fill="#475569">the reviewed commit</text>
